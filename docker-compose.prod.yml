# Schoolify production stack: web (Next.js) + API (AdonisJS) + worker +
# Postgres + Redis, deployed together as ONE compose project.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Host nginx terminates TLS for schoolify.twelveai.app and routes
#   /api/  -> 127.0.0.1:${API_PORT:-4200}  (backend)
#   /      -> 127.0.0.1:${WEB_PORT:-4201}  (web)
# so the browser talks to one origin and needs no CORS.
#
# The frontend is built from FRONTEND_DIR (default ../frontend) until it
# has its own repository. Ports bind to 127.0.0.1 only; Postgres and
# Redis are not exposed at all.
name: schoolify

x-backend: &backend
  build:
    context: .
    target: runtime
  image: schoolify-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3333'
    DB_HOST: postgres
    DB_PORT: '5432'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    <<: *backend
    # Migrations run on every start (idempotent) before the server boots.
    command: ['sh', '-c', 'node ace migration:run --force && node bin/server.js']
    ports:
      - '127.0.0.1:${API_PORT:-4200}:3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3333/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend
    # Queues: emails, period reminders, WhatsApp inbound, weekly risk scan.
    command: ['node', 'ace', 'worker']
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ${FRONTEND_DIR:-../frontend}
      args:
        # Empty = same-origin relative API calls (/api/v1/...).
        NEXT_PUBLIC_API_URL: ''
    image: schoolify-web:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-4201}:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
