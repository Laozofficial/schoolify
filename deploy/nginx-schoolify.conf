# Host nginx site for schoolify.twelveai.app (one origin for web + API).
# Install: /etc/nginx/sites-available/schoolify + symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. certbot adds the 443 block.

server {
    listen 80;
    listen [::]:80;
    server_name schoolify.twelveai.app;

    # Uploads (photos, assignment files) go through the API.
    client_max_body_size 20m;

    # API: AdonisJS backend (all routes live under /api/v1).
    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI features (assistant, copilot, grading) can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Everything else: Next.js web app.
    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
